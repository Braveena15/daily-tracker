<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151c19" media="(prefers-color-scheme: dark)" />
    <title>Daily Tracker</title>
    <script>
      // Apply the saved theme before the page paints (see src/context/ThemeProvider.tsx)
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
